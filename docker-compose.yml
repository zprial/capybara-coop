services:
  capybara-coop:
    # build context = 仓库根目录，Dockerfile 直接 COPY 根目录的 capybara-coop.html
    build: .
    image: capybara-coop:latest
    container_name: capybara-coop
    ports:
      # 若前面挂了 Nginx / Caddy 做 HTTPS 反代，可改成 "127.0.0.1:31118:31118"
      - "31118:31118"
    environment:
      PORT: "31118"
      HOST: "0.0.0.0"
      RELAY_PATH: "/relay"
      # MAX_FRAME: "2097152"
    restart: unless-stopped
